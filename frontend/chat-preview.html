<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nearu チャットUIプレビュー</title>
<style>body{background:#edf4ef!important}.preview-tools{padding:12px;text-align:center;font-size:13px}.preview-tools button{margin:8px 4px 0;padding:7px 18px;border:1px solid #092f32;border-radius:20px;background:white;cursor:pointer}.preview-tools button[aria-pressed=true]{background:#ffe36c}.chat-screen{margin:auto;height:calc(100dvh - 100px)!important;min-height:580px}.preview-tools p{color:#42666c}</style></head>
<body><header class="preview-tools"><p>チャットUIプレビュー・サンプルデータ（外部への送信なし）</p><button id="citizen" aria-pressed="true">市民側</button><button id="hero" aria-pressed="false">ヒーロー側</button><button id="reset">会話をリセット</button></header>
<main class="screen screen--narrow chat-screen">
<div class="chat-brand"><a class="chat-back" href="/messages" aria-label="アプリへ戻る">←</a><img id="logo" alt="Nearu"><details class="chat-menu"><summary aria-label="チャットメニュー">⋮</summary><div><a href="/messages">アプリのメッセージ一覧へ</a></div></details></div>
<div class="chat-person"><span class="chat-avatar"></span><div><h1 id="partner">えいと</h1><p id="relation">依頼を引き受けた相手</p></div></div>
<header class="chat-header"><svg class="chat-package" viewBox="0 0 48 48" fill="#ffedb0" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="m4 13 20-8 20 8v23l-20 9-20-9Z"/><path d="m4 13 20 9 20-9M24 22v23M15 9l20 9v10"/></svg><div class="message-summary"><div class="message-summary__badges"><span></span><span class="message-badge">対応中</span></div><h2 class="message-summary__title">駅前で荷物を持ってほしいです</h2><p class="message-summary__location">⌖ 駅前</p></div></header>
<div class="chat-thread" id="thread" role="log" aria-label="サンプル会話" aria-live="polite"></div>
<p class="chat-safety"><svg viewBox="0 0 48 54" aria-hidden="true"><path d="M24 3 44 11v16c0 11-13 20-20 24C17 47 4 38 4 27V11Z" fill="#fff" stroke="currentColor" stroke-width="3"/><path d="m24 9 14 6v12c0 7-8 14-14 18-6-4-14-11-14-18V15Z" fill="#008c76"/><path d="M24 35s-11-7-11-13c0-6 8-7 11-1 3-6 11-5 11 1 0 6-11 13-11 13" fill="white"/></svg><span>個人情報やお金のやり取りはしないでください</span></p>
<form class="chat-input" id="form"><textarea id="draft" rows="1" maxlength="2000" aria-label="メッセージ" placeholder="メッセージを入力…"></textarea><button class="icon-btn" id="send" type="submit" aria-label="サンプル送信" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 12 16-8-6 16-3-6-7-2Z"/></svg></button></form><p class="chat-input-hint">Enterで改行・Ctrl / ⌘ + Enterで送信<span id="count">0 / 2000</span></p>
<nav class="chat-nav"><a href="/map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21S5 15 5 9a7 7 0 0 1 14 0c0 6-7 12-7 12Z"/><circle cx="12" cy="9" r="2"/></svg><span>地図</span></a><a href="/messages" class="is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5.5h16v10.5H9l-5 4V5.5Z"/></svg><span>メッセージ</span></a><a href="/mypage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-8 14-8 14 0"/></svg><span>マイページ</span></a></nav></main>
<script type="module">
import '/src/index.css';
import '/src/pages/Messages.css';
import '/src/pages/Chat.css';
import logo from '/src/assets/nearu-logo.png';
document.querySelector('#logo').src=logo;
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-8 14-8 14 0"/></svg>';
document.querySelector('.chat-person .chat-avatar').innerHTML=icon;
let role='citizen';
const initial=[{sender:'citizen',text:'来てくれてありがとうございます',time:'10:12'},{sender:'citizen',text:'今、入口の前にいます',time:'10:14'},{sender:'hero',text:'もうすぐ着きます',time:'10:15'}];
let messages=[...initial];
const thread=document.querySelector('#thread'),draft=document.querySelector('#draft'),send=document.querySelector('#send');
function render(){thread.replaceChildren();for(const message of messages){const own=message.sender===role;const row=document.createElement('div');row.className='chat-bubble-row chat-bubble-row--'+(own?'me':'other');const avatar=document.createElement('span');avatar.className='chat-avatar'+(own?' chat-avatar--own':'');avatar.innerHTML=icon;const content=document.createElement('div');content.className='chat-message-content';const bubble=document.createElement('div');bubble.className='chat-bubble chat-bubble--text';bubble.textContent=message.text;const time=document.createElement('span');time.className='chat-bubble-row__time';time.textContent=message.time;content.append(bubble,time);row.append(avatar,content);thread.append(row);}thread.scrollTop=thread.scrollHeight;}
for(const next of ['citizen','hero'])document.getElementById(next).onclick=()=>{role=next;document.getElementById('partner').textContent=role==='citizen'?'えいと':'みこ';document.getElementById('relation').textContent=role==='citizen'?'依頼を引き受けた相手':'依頼した相手';for(const item of ['citizen','hero'])document.getElementById(item).setAttribute('aria-pressed',String(item===role));render();};
function update(){send.disabled=!draft.value.trim();document.getElementById('count').textContent=draft.value.length+' / 2000';}
draft.oninput=update;
document.getElementById('form').onsubmit=e=>{e.preventDefault();if(!draft.value.trim())return;messages.push({sender:role,text:draft.value.trim(),time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});draft.value='';update();render();draft.focus();};
draft.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!e.isComposing&&e.keyCode!==229){e.preventDefault();document.getElementById('form').requestSubmit();}};
document.getElementById('reset').onclick=()=>{messages=[...initial];draft.value='';update();render();};render();
</script></body></html>
